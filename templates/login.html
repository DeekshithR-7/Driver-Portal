<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AUTOCAB Driver Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>AUTOCAB</h1>

        <p class="subtitle">
            Driver Portal
        </p>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                <div class="alert">

                    {{ messages[0] }}

                </div>

            {% endif %}

        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="phone"
                placeholder="Enter Mobile Number"
                maxlength="10"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</div>

</body>

</html>
